name: CDK Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: cd iac && npm ci
      - run: npm run build
      - run: npm run test
      # Uncomment below to enable CloudFormation synthesis with real AWS credentials
      # This requires AWS_ACCOUNT_ID GitHub secret to be configured
      # - run: npm run synth
      #   env:
      #     CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
      #     CDK_DEFAULT_REGION: us-east-1
